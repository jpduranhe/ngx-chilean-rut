name: Publish to NPM

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    # Runner de GitHub: no hay runners self-hosted registrados en el repo, y
    # apuntar a uno inexistente deja el job encolado para siempre, sin error.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # El Trusted Publishing por OIDC requiere npm >= 11.5.1 y Node 22 trae
      # una version anterior.
      #
      # Se fija el major en 12 en vez de usar `latest`. `latest` arrastra el
      # proximo major sin aviso, y npm 12 ya trajo cambios que rompen
      # (allowScripts, --allow-git y --allow-remote pasaron a opt-in). Es la
      # misma razon por la que TypeScript esta fijado en ~6.0.3.
      - name: Actualizar npm
        run: npm install -g npm@12

      # Falla temprano y con un mensaje que se explica solo. Sin esto, la falta
      # de credenciales aparece recien al final como un ENEEDAUTH generico,
      # despues de haber corrido lint, tests y build para nada.
      - name: Verificar credenciales de npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "npm: $(npm --version)  ·  node: $(node --version)"
          if [ -n "$NPM_TOKEN" ]; then
            echo "Autenticacion: token (secret NPM_TOKEN presente)."
            exit 0
          fi
          echo "Secret NPM_TOKEN ausente. Probando Trusted Publishing por OIDC..."
          if npm whoami >/dev/null 2>&1; then
            echo "Autenticacion: OIDC. Publicando como $(npm whoami)."
            exit 0
          fi
          echo "::error::No hay credenciales de npm. Configura UNA de las dos:"
          echo "::error::  A) Trusted Publishing (recomendado, sin secretos):"
          echo "::error::     npmjs.com -> ngx-chilean-rut -> Settings -> Trusted Publisher"
          echo "::error::     Repository: ${{ github.repository }}   Workflow: publish.yml"
          echo "::error::  B) Token: crear un Automation token en npm y agregarlo"
          echo "::error::     como secret NPM_TOKEN en este repositorio."
          exit 1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Gate de calidad: si el lint o los tests fallan, NO se publica.
      # Sin esto, una suite roja llega a npm sin que nadie se entere.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build Library
        run: npm run build

      # Autenticacion, por orden de preferencia:
      #
      # 1. Trusted Publishing (OIDC). No necesita ningun secret: se configura
      #    una vez en npmjs.com apuntando a este repo y a este archivo de
      #    workflow. Es lo que habilita el permiso `id-token: write` de arriba.
      # 2. Token clasico, si existe el secret NPM_TOKEN.
      #
      # setup-node ya dejo el .npmrc apuntando al registry con el placeholder
      # de NODE_AUTH_TOKEN, asi que no hay que escribirlo a mano: hacerlo con
      # un token vacio es justamente lo que rompe el OIDC.
      - name: Publish
        run: npm publish --access public
        working-directory: dist/ngx-chilean-rut
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
