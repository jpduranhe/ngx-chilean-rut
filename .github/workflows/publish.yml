name: Publish to NPM

# Un solo disparador automatico: el tag. Antes tambien escuchaba
# `release: created`, y como un release de GitHub se crea a partir de un tag,
# ambos eventos disparaban la misma publicacion. La segunda siempre falla,
# porque npm no permite republicar una version ya existente.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    # Runner de GitHub: no hay runners self-hosted registrados en el repo, y
    # apuntar a uno inexistente deja el job encolado para siempre, sin error.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # El Trusted Publishing por OIDC requiere npm >= 11.5.1 y Node 22 trae
      # una version anterior.
      #
      # Se fija el major en 12 en vez de usar `latest`. `latest` arrastra el
      # proximo major sin aviso, y npm 12 ya trajo cambios que rompen
      # (allowScripts, --allow-git y --allow-remote pasaron a opt-in). Es la
      # misma razon por la que TypeScript esta fijado en ~6.0.3.
      - name: Actualizar npm
        run: npm install -g npm@12

      # Deja registrado el contexto de autenticacion para que, si el publish
      # falla, la causa se lea de inmediato sin abrir el log crudo.
      #
      # NO decide si hay credenciales validas: el intercambio del token OIDC
      # ocurre dentro de `npm publish`, no en comandos como `npm whoami`, asi
      # que cualquier chequeo previo da un falso negativo con Trusted
      # Publishing correctamente configurado. La autoridad es `npm publish`.
      - name: Contexto de autenticacion
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "npm: $(npm --version)  ·  node: $(node --version)"
          echo "El OIDC requiere npm >= 11.5.1."
          if [ -n "$NPM_TOKEN" ]; then
            echo "Metodo previsto: token (secret NPM_TOKEN presente)."
          else
            echo "Metodo previsto: Trusted Publishing por OIDC (sin secret NPM_TOKEN)."
            echo "Si el publish termina en ENEEDAUTH, revisa en npmjs.com que el"
            echo "Trusted Publisher apunte exactamente a:"
            echo "  Repository: ${{ github.repository }}"
            echo "  Workflow:   publish.yml"
            echo "  Environment: (vacio)"
          fi

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Gate de calidad: si el lint o los tests fallan, NO se publica.
      # Sin esto, una suite roja llega a npm sin que nadie se entere.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build Library
        run: npm run build

      # Autenticacion, por orden de preferencia:
      #
      # 1. Trusted Publishing (OIDC). No necesita ningun secret: se configura
      #    una vez en npmjs.com apuntando a este repo y a este archivo de
      #    workflow. Es lo que habilita el permiso `id-token: write` de arriba.
      # 2. Token clasico, si existe el secret NPM_TOKEN.
      #
      # setup-node ya dejo el .npmrc apuntando al registry con el placeholder
      # de NODE_AUTH_TOKEN, asi que no hay que escribirlo a mano: hacerlo con
      # un token vacio es justamente lo que rompe el OIDC.
      # Republicar una version ya existente es un no-op, no un error: el
      # objetivo del workflow es "esta version esta en npm", y si ya lo esta,
      # se cumplio. npm devuelve E403 en ese caso, que es indistinguible de un
      # problema de permisos, asi que se comprueba antes contra el registro.
      - name: Publish
        working-directory: dist/ngx-chilean-rut
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION ya esta publicada en npm. Nada que hacer."
            exit 0
          fi

          echo "Publicando $NAME@$VERSION..."
          npm publish --access public
