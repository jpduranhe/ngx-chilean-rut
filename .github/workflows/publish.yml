name: Publish to NPM

on:
  release:
    types: [created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    # Runner de GitHub: no hay runners self-hosted registrados en el repo, y
    # apuntar a uno inexistente deja el job encolado para siempre, sin error.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # El Trusted Publishing por OIDC requiere npm >= 11.5.1, y Node 22 trae
      # una version anterior.
      - name: Actualizar npm
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Gate de calidad: si el lint o los tests fallan, NO se publica.
      # Sin esto, una suite roja llega a npm sin que nadie se entere.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build Library
        run: npm run build

      # Autenticacion, por orden de preferencia:
      #
      # 1. Trusted Publishing (OIDC). No necesita ningun secret: se configura
      #    una vez en npmjs.com apuntando a este repo y a este archivo de
      #    workflow. Es lo que habilita el permiso `id-token: write` de arriba.
      # 2. Token clasico, si existe el secret NPM_TOKEN.
      #
      # setup-node ya dejo el .npmrc apuntando al registry con el placeholder
      # de NODE_AUTH_TOKEN, asi que no hay que escribirlo a mano: hacerlo con
      # un token vacio es justamente lo que rompe el OIDC.
      - name: Publish
        run: npm publish --access public
        working-directory: dist/ngx-chilean-rut
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
